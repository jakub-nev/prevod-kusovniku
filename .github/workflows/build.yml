name: build

# Spustitelne soubory se stavi tam, kam patri - cross-kompilace u PyInstaller
# neexistuje, macOS binarka musi vzniknout na macOS.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller pywebview
      - run: pyinstaller --noconfirm --onefile --windowed --name "Prevod kusovniku" --icon ikona.ico --add-data "web;web" --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 --exclude-module qtpy --exclude-module gi --exclude-module numpy --exclude-module cefpython3 prevod_ui.py
      - name: Kontrola, ze se web zabalil do binarky
        run: '& "dist/Prevod kusovniku.exe" --kontrola'
      - uses: actions/upload-artifact@v4
        with:
          name: prevod-kusovniku-windows
          path: dist/Prevod kusovniku.exe

  macos-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pyinstaller pywebview
      - run: pyinstaller --noconfirm --windowed --name "Prevod kusovniku" --icon ikona.icns --add-data "web:web" --exclude-module PyQt5 --exclude-module PyQt6 --exclude-module PySide2 --exclude-module PySide6 --exclude-module qtpy --exclude-module gi --exclude-module numpy --exclude-module cefpython3 prevod_ui.py
      - name: Kontrola architektury
        run: |
          file "dist/Prevod kusovniku.app/Contents/MacOS/Prevod kusovniku"
          file "dist/Prevod kusovniku.app/Contents/MacOS/Prevod kusovniku" | grep -q x86_64
      - name: Kontrola, ze se web zabalil do binarky
        run: '"dist/Prevod kusovniku.app/Contents/MacOS/Prevod kusovniku" --kontrola'
      - name: Zabalit .app
        run: ditto -c -k --keepParent "dist/Prevod kusovniku.app" "Prevod kusovniku-mac-intel.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: prevod-kusovniku-mac-intel
          path: Prevod kusovniku-mac-intel.zip
